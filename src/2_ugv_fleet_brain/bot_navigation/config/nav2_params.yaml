controller_server:
  ros__parameters:
    use_sim_time: true
    # 20 Hz was never met (sim at RTF 100% starves Nav2 -> actual ~2.2 Hz,
    # "Planner loop missed its desired rate"). 10 Hz is ample for a 0.5 m/s
    # patrol and stops the flood of rate-miss warnings + jerky control.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5           # 0.3 -> 0.5: more slack before aborting to recovery
    # REQUIRED in Jazzy: without these top-level plugin lists the
    # controller_server aborts on configure (crash observed as
    # "controller_server has stopped unexpectedly").
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0   # 15 -> 10: detect "stuck" faster, fail goal sooner
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Ackermann patrol: reaching the waypoint position matters, final
      # heading does not, so the yaw tolerance is deliberately loose.
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 3.14
    FollowPath:
      # ---- APF Controller (replaces RPP + costmap collision detection) ----
      # Reactive obstacle avoidance via Artificial Potential Fields.
      # Reads raw 3D LiDAR and IMU directly — no costmap is consulted.
      plugin: "bot_navigation::APFController"

      # Attractive force: constant-magnitude pull toward goal
      k_att: 1.0

      # Repulsive force: inverse-square push from nearby obstacles
      k_rep: 0.8
      influence_distance: 4.0       # d0: obstacles beyond this are ignored (m)

      # Slope avoidance: IMU pitch-based dune rejection
      k_slope: 2.0
      pitch_threshold: 0.21         # ~12 degrees — steeper = push backward

      # Ackermann constraints
      max_linear_vel: 0.5
      min_turning_radius: 3.36      # R_min (m)
      wheelbase: 0.9                # L (m)

      # Sensor inputs (subscribed directly, not through costmap)
      scan_topic: "/scan/points"    # raw 3D LiDAR
      imu_topic: "/imu"             # IMU for pitch
      obstacle_height_min: 0.15     # ignore ground (m in sensor frame)
      obstacle_height_max: 2.0      # ignore high returns (m)
      obstacle_range_max: 8.0       # ignore distant points (m)

      transform_tolerance: 2.0

# Local costmap: kept minimal. controller_server requires a costmap to exist,
# but the APF controller ignores it entirely — obstacle avoidance comes from
# direct sensor reads. No voxel_layer, no inflation, no obstacle marking.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 1.0         # low rate: costmap is vestigial
      publish_frequency: 1.0
      transform_tolerance: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.2              # coarse: not used for navigation
      robot_radius: 0.7
      plugins: []                   # NO obstacle layers — APF handles avoidance
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 2.0   # absorb bursty map->odom TF; also stops laser Message Filter drops
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      footprint: "[[-0.7, -0.4], [0.7, -0.4], [0.7, 0.4], [-0.7, 0.4]]"
      # ROLLING WINDOW: 140x140 m @0.4 m = 350x350 = ~122k cells. Half-window
      # (70 m) now exceeds SBLP l_max (35 m) with margin, so goals always land
      # inside the reachable window (fixes repeated "no valid path found" when
      # l_max==half-window). 0.4 m resolution keeps the larger window real-time
      # for Smac Hybrid-A*.
      rolling_window: true
      width: 140
      height: 140
      resolution: 0.4
      track_unknown_space: true
      # static_layer REMOVED: using it inside a rolling_window costmap causes
      # SIGSEGV (exit code -11) in planner_server. The static layer's index
      # arithmetic assumes fixed costmap origin/dimensions, but the rolling
      # window shifts origin every cycle → out-of-bounds memory writes.
      # Terrain slope awareness is preserved via ugv_obstacle's DEM-prior
      # differencing, which publishes slope-lethal cells on /scan/obstacles.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # 3D obstacle cloud (slopes removed by ugv_obstacle DEM-prior node).
        observation_sources: pointcloud
        pointcloud:
          topic: /scan/obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 1.0   # >= self_radius; see local_costmap note
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0      # Steeper cost scaling for better path planning
        # MUST be >= the footprint's circumscribed radius (0.82 m for the
        # 1.4x0.8 m chassis). Smac Hybrid-A* uses the inflation potential field
        # to skip full-footprint SE2 collision checks; with 0.6 m it lost that
        # optimization ("inflation radius is smaller than the circumscribed
        # radius ... will substantially impact run-time performance") and then
        # timed out -> "no valid path found" on every goal. Do not lower this.
        inflation_radius: 0.9
      always_send_full_costmap: false

map_server:
  ros__parameters:
    use_sim_time: true
    # Map file will be provided by launch file parameter
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    publish_expansions: true
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      # REEDS_SHEPP keeps reverse available for tight spots (dead-ends,
      # cornering), but reverse_penalty is high so the planner only reverses
      # when a forward solution doesn't exist. Prevents the constant
      # back-first behaviour while retaining reverse as a genuine last resort.
      motion_model_for_search: "REEDS_SHEPP"
      tolerance: 0.5
      minimum_turning_radius: 3.36
      reverse_penalty: 5.0         # strongly prefer forward; reverse only if needed
      change_penalty: 0.8
      bend_penalty: 2.0
      non_straight_penalty: 1.0
      cost_penalty: 2.0
      allow_unknown: true
      analytic_expansion_ratio: 3.5    # default (was 2.0 to force reversing)
      analytic_expansion_max_length: 20.0
      angle_quantization_bins: 48     # 72 -> 48 (7.5°); smaller search space, faster
      search_info:
        # Back to 2000: 800 ms combined with the broken potential field (see
        # inflation_radius) made every search time out. With inflation restored
        # the search is fast again, and the headroom prevents spurious failures
        # on long legs.
        primitive_search_max_duration_ms: 2000

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 2000                   # Increased iterations for better smoothing
      do_refinement: true
      refinement_num: 3               # Multiple refinement passes

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp" 
      backup_speed: 0.15              # Slower backup for safety
      backup_distance: 0.7           # Moderate backup distance
      time_allowance: 10.0            # Longer time allowance
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      max_linear_vel: 0.3             # Conservative velocity
      max_angular_vel: 0.5            # Reduced for stability
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0          # 0.2 -> 1.0: bursty TF broke backup/drive_on_heading
    use_sim_time: true
    simulate_ahead_time: 3.0          # Longer simulation for Ackermann stability
    max_rotational_vel: 0.6           # Reduced for smoother motion  
    min_rotational_vel: 0.15          # Minimum rotation speed
    rotational_acc_lim: 1.5           # Gentler angular acceleration

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0        # Increased frequency for smoother motion
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 0.8]    # Updated for Ackermann: [max_x, max_y, max_theta]
    min_velocity: [-0.8, 0.0, -0.8]  # Allow reverse motion
    max_accel: [1.2, 0.0, 1.8]       # Slightly reduced for smoother acceleration  
    max_decel: [-1.8, 0.0, -2.2]     # More gradual deceleration for comfort
    odom_topic: "/odometry/filtered"  # Use enhanced localization
    odom_duration: 0.15              # Slightly longer for stability
    deadband_velocity: [0.02, 0.0, 0.05]  # Small deadband to reduce jitter
    velocity_timeout: 1.0