bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map 
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # Only load NavigateToPose. NavigateThroughPoses requires the
    # compute_path_through_poses action server (planner_server), which is
    # intentionally absent in the plannerless TRN direct-RPP stack.
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    plugin_lib_names:
      - goal_to_path_bt_node
    default_nav_to_pose_bt_xml: "$(find-pkg-share bot_navigation)/behavior_trees/ackermann_to_bt.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share bot_navigation)/behavior_trees/ackermann_through_bt.xml"
